<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 HTML Lab</title>
</head>

<body>

    <header>
        <h1>My HTML5 Web Page</h1>

        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#multimedia">Multimedia</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="about">
            <h2>About HTML5</h2>
            <p>
                HTML5 introduces semantic elements and multimedia integration,
                making web pages more accessible and structured.
            </p>
        </section>

        <section id="multimedia">
            <h2>Multimedia Features</h2>

            <figure>
                <img src="image123.jpg"
                     width="400"
                     height="400"
                     alt="Placeholder Image">

                <figcaption>
                    Figure 1: Placeholder image demonstrating multimedia.
                </figcaption>
            </figure>

            <video width="400" height="400" controls>
                <source src="video123.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

        </section>

    </main>

   <footer>
        <p>Created by [DIANA SHANE R. REBLORA] | © 2025</p>
    </footer>

</body>

</html>
